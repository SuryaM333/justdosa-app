<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Just Dosa — Restaurant & Table Management</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#E37A08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Just Dosa" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            handleChunkError();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var message = (e.reason && e.reason.message) || '';
          if (
            message.indexOf('dynamically imported') > -1 ||
            message.indexOf('Loading chunk') > -1 ||
            message.indexOf('ChunkLoadError') > -1 ||
            message.indexOf('Failed to fetch') > -1
          ) {
            handleChunkError();
          }
        });

        function handleChunkError() {
          var hasReloaded = sessionStorage.getItem('just_dosa_chunk_reload_attempted');
          if (!hasReloaded) {
            sessionStorage.setItem('just_dosa_chunk_reload_attempted', 'true');
            window.location.reload();
          } else {
            showFallbackUI();
          }
        }

        function showFallbackUI() {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            root.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background-color: #1C1917; color: #FDFBF7; font-family: sans-serif;"><div style="width: 100%; max-width: 448px; padding: 32px; border-radius: 24px; background-color: #2D2926; border: 1px solid rgba(232, 226, 210, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55); text-align: center;"><div style="margin-bottom: 24px;"><div style="width: 144px; height: 144px; margin: 0 auto; display: flex; align-items: center; justify-content: center; position: relative;"><div style="position: absolute; inset: 0; border-radius: 9999px; background-color: rgba(227, 122, 8, 0.05); filter: blur(24px); transform: scale(1.25);"></div><img src="/logo.png" alt="Just Dosa Logo" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));" onerror="this.src=\'https://ais-dev-ipicu2zxhweg3nwcvvavuf-1036813440193.asia-southeast1.run.app/logo.png\'" /></div></div><div style="margin-bottom: 24px;"><span style="display: inline-block; padding: 4px 12px; border-radius: 6px; background-color: rgba(239, 68, 68, 0.1); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;">System Error</span><h1 style="font-size: 28px; font-weight: bold; color: #ffffff; letter-spacing: -0.025em; margin: 0 0 4px 0;">Something went wrong</h1><p style="font-size: 11px; color: #B8ACA0; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin: 0;">We encountered an issue loading this page</p></div><div style="font-size: 14px; color: #B8ACA0; line-height: 1.6; max-width: 320px; margin: 0 auto 24px auto;">An error occurred while loading the application assets. This usually happens after an update. Please reload to try again.</div><div><button onclick="sessionStorage.removeItem(\'just_dosa_chunk_reload_attempted\'); window.location.reload();" style="width: 100%; padding: 18px 24px; border-radius: 12px; background-color: #E37A08; color: #ffffff; font-weight: bold; font-size: 16px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 15px -3px rgba(227, 122, 8, 0.15); transition: background-color 0.2s; font-family: sans-serif;">Reload Application</button></div></div></div>';
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
