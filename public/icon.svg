<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Soft subtle background shadow and light warm badge base -->
  <circle cx="256" cy="256" r="248" fill="#FFFDF9" stroke="#E8E2D2" stroke-width="4"/>
  <circle cx="256" cy="256" r="240" fill="#FFFDF9" />

  <!-- LEFT CHEF (x-offset around 180) -->
  <g id="left-chef">
    <!-- Body/Uniform -->
    <path d="M 130 280 C 130 280, 140 370, 220 370 C 220 370, 225 280, 225 280 Z" fill="#FFFFFF" stroke="#4A2A0D" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 155 295 L 155 350" stroke="#E8E2D2" stroke-width="3" stroke-linecap="round"/>
    <!-- Double-breasted buttons -->
    <circle cx="175" cy="305" r="3.5" fill="#4A2A0D"/>
    <circle cx="175" cy="325" r="3.5" fill="#4A2A0D"/>
    <circle cx="175" cy="345" r="3.5" fill="#4A2A0D"/>
    <circle cx="195" cy="305" r="3.5" fill="#4A2A0D"/>
    <circle cx="195" cy="325" r="3.5" fill="#4A2A0D"/>
    <circle cx="195" cy="345" r="3.5" fill="#4A2A0D"/>

    <!-- Left Arm holding Dosa plate -->
    <path d="M 135 295 Q 100 305 95 325" stroke="#4A2A0D" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Steel plate -->
    <ellipse cx="85" cy="328" rx="36" ry="10" fill="#CFD8DC" stroke="#4A2A0D" stroke-width="4"/>
    <ellipse cx="85" cy="328" rx="28" ry="6" fill="#B0BEC5"/>
    <!-- Small bowls (chutney & sambar) on plate -->
    <circle cx="70" cy="328" r="6" fill="#FF9800" stroke="#4A2A0D" stroke-width="2"/>
    <circle cx="82" cy="330" r="6" fill="#4CAF50" stroke="#4A2A0D" stroke-width="2"/>
    <!-- Crispy Golden Dosa -->
    <path d="M 58 322 Q 85 298 112 322 L 106 327 Q 85 306 64 327 Z" fill="#FFB74D" stroke="#4A2A0D" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Neck and Red Bowtie -->
    <rect x="170" y="265" width="20" height="15" fill="#FAD09E" stroke="#4A2A0D" stroke-width="4"/>
    <path d="M 165 272 L 180 282 L 195 272 L 190 290 L 170 290 Z" fill="#D32F2F" stroke="#4A2A0D" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="180" cy="279" r="4.5" fill="#D32F2F"/>

    <!-- Face and Hair -->
    <path d="M 135 240 C 135 240, 130 215, 180 215 C 230 215, 225 240, 225 240" stroke="#4A2A0D" stroke-width="5" fill="none"/>
    <circle cx="180" cy="242" r="46" fill="#FAD09E" stroke="#4A2A0D" stroke-width="5"/>
    <!-- Smiling eyes and eyebrows -->
    <path d="M 152 225 Q 162 215 172 225" stroke="#4A2A0D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 188 225 Q 198 215 208 225" stroke="#4A2A0D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="164" cy="236" r="4" fill="#4A2A0D"/>
    <circle cx="196" cy="236" r="4" fill="#4A2A0D"/>
    <!-- Friendly Beard/Mustache/Smile -->
    <path d="M 150 250 Q 180 256 210 250 Q 180 292 150 250" fill="#3E2723" stroke="#4A2A0D" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 160 252 Q 180 268 200 252" stroke="#4A2A0D" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 168 253 Q 180 258 192 253" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Blushing cheeks -->
    <circle cx="148" cy="246" r="5" fill="#FF8A8A" opacity="0.5"/>
    <circle cx="212" cy="246" r="5" fill="#FF8A8A" opacity="0.5"/>

    <!-- Tall Chef Hat -->
    <path d="M 140 196 C 115 175, 140 120, 180 125 C 220 120, 245 175, 220 196 Z" fill="#FFFFFF" stroke="#4A2A0D" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 165 127 C 175 140, 185 140, 195 127" stroke="#E8E2D2" stroke-width="3" fill="none"/>
    <rect x="144" y="184" width="72" height="15" rx="4" fill="#FFFFFF" stroke="#4A2A0D" stroke-width="5"/>
  </g>

  <!-- RIGHT CHEF (x-offset around 332) -->
  <g id="right-chef">
    <!-- Body/Uniform -->
    <path d="M 282 280 C 282 280, 287 370, 367 370 C 367 370, 377 280, 377 280 Z" fill="#FFFFFF" stroke="#4A2A0D" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 352 295 L 352 350" stroke="#E8E2D2" stroke-width="3" stroke-linecap="round"/>
    <!-- Double-breasted buttons -->
    <circle cx="312" cy="305" r="3.5" fill="#4A2A0D"/>
    <circle cx="312" cy="325" r="3.5" fill="#4A2A0D"/>
    <circle cx="312" cy="345" r="3.5" fill="#4A2A0D"/>
    <circle cx="332" cy="305" r="3.5" fill="#4A2A0D"/>
    <circle cx="332" cy="325" r="3.5" fill="#4A2A0D"/>
    <circle cx="332" cy="345" r="3.5" fill="#4A2A0D"/>

    <!-- Right Arm holding Idli plate -->
    <path d="M 372 295 Q 407 305 412 325" stroke="#4A2A0D" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Steel plate -->
    <ellipse cx="422" cy="328" rx="36" ry="10" fill="#CFD8DC" stroke="#4A2A0D" stroke-width="4"/>
    <ellipse cx="422" cy="328" rx="28" ry="6" fill="#B0BEC5"/>
    <!-- Delicious Soft White Idlis with chutney bowls -->
    <circle cx="410" cy="325" r="8.5" fill="#F5F5F5" stroke="#4A2A0D" stroke-width="2.5"/>
    <circle cx="424" cy="324" r="8.5" fill="#F5F5F5" stroke="#4A2A0D" stroke-width="2.5"/>
    <circle cx="434" cy="327" r="8.5" fill="#F5F5F5" stroke="#4A2A0D" stroke-width="2.5"/>
    <circle cx="418" cy="331" r="4.5" fill="#E0F2F1" stroke="#4A2A0D" stroke-width="1.5"/>

    <!-- Neck and Red Bowtie -->
    <rect x="317" y="265" width="20" height="15" fill="#FAD09E" stroke="#4A2A0D" stroke-width="4"/>
    <path d="M 312 272 L 327 282 L 342 272 L 337 290 L 317 290 Z" fill="#D32F2F" stroke="#4A2A0D" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="327" cy="279" r="4.5" fill="#D32F2F"/>

    <!-- Face and Hair -->
    <path d="M 282 240 C 282 240, 277 215, 327 215 C 377 215, 372 240, 372 240" stroke="#4A2A0D" stroke-width="5" fill="none"/>
    <circle cx="327" cy="242" r="46" fill="#FAD09E" stroke="#4A2A0D" stroke-width="5"/>
    <!-- Smiling eyes and eyebrows -->
    <path d="M 299 225 Q 309 215 319 225" stroke="#4A2A0D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 335 225 Q 345 215 355 225" stroke="#4A2A0D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="311" cy="236" r="4" fill="#4A2A0D"/>
    <circle cx="343" cy="236" r="4" fill="#4A2A0D"/>
    <!-- Happy smiling mouth -->
    <path d="M 309 248 Q 327 270 345 248" stroke="#4A2A0D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 315 251 Q 327 262 339 251" fill="#FFFFFF" stroke="#4A2A0D" stroke-width="2"/>
    <!-- Blushing cheeks -->
    <circle cx="295" cy="246" r="5" fill="#FF8A8A" opacity="0.5"/>
    <circle cx="359" cy="246" r="5" fill="#FF8A8A" opacity="0.5"/>

    <!-- Tall Chef Hat -->
    <path d="M 287 196 C 262 175, 287 120, 327 125 C 367 120, 392 175, 367 196 Z" fill="#FFFFFF" stroke="#4A2A0D" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 312 127 C 322 140, 332 140, 342 127" stroke="#E8E2D2" stroke-width="3" fill="none"/>
    <rect x="291" y="184" width="72" height="15" rx="4" fill="#FFFFFF" stroke="#4A2A0D" stroke-width="5"/>
  </g>

  <!-- BANANA LEAF BANNER (At the bottom, holding the name) -->
  <g id="banana-leaf">
    <!-- Outer Leaf Contour -->
    <path d="M 40 375 Q 256 465 472 375 Q 256 505 40 375" fill="#388E3C" stroke="#1B5E20" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner leaf highlights & ribs -->
    <path d="M 40 375 Q 256 430 472 375" stroke="#81C784" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Leaf vein slashes for rich texture -->
    <path d="M 100 392 L 92 410 M 160 405 L 150 428 M 220 412 L 215 440 L 210 445 M 280 411 L 285 438 M 340 406 L 348 428 M 400 395 L 412 412" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- PLAYFUL LETTERING FOR "Just Dosa" (Sticker Outline effect) -->
  <g id="text-logo">
    <!-- Thick dark outline background -->
    <text x="256" y="446" font-family="'Fredoka One', 'CoCoGothic', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="44" fill="#1B5E20" stroke="#1B5E20" stroke-width="12" stroke-linejoin="round" text-anchor="middle" letter-spacing="1">Just Dosa</text>
    <!-- Bright energetic lime-yellow fill overlay -->
    <text x="256" y="446" font-family="'Fredoka One', 'CoCoGothic', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="44" fill="#DCEDC8" text-anchor="middle" letter-spacing="1">Just Dosa</text>
  </g>
</svg>
